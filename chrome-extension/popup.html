<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box}body{width:310px;margin:0;padding:20px;font:13px system-ui,-apple-system,'Segoe UI',sans-serif;color:#17202b;background:#f7f9fb}
  h1{font-size:20px;margin:0 0 3px}.sub{color:#64748b;margin-bottom:18px;line-height:1.6}
  .card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:15px}
  label{display:block;font-weight:600;font-size:12px;margin-bottom:7px}input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;outline:none;font:12px monospace}
  input:focus-visible,button:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
  button:disabled{opacity:.55;cursor:wait}
  button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;width:100%;font-weight:600;cursor:pointer;margin-top:10px}
  #status{margin-top:14px;color:#475569;font-size:12px}.note{font-size:11px;color:#64748b;line-height:1.65;margin-top:15px}
</style></head><body>
  <h1>VoicePilot</h1><div class="sub">声でPCを操作・ChatGPTへ質問を用意</div>
  <div class="card">
    <label for="token">Windowsアプリのペアリングコード</label>
    <input id="token" type="password" spellcheck="false" placeholder="コピーしたコードを貼り付け">
    <button id="connect">接続する</button>
    <div id="status" role="status" aria-live="polite">状態を確認しています…</div>
  </div>
  <div class="note">コードは端末内に保存します。接続先は 127.0.0.1 のみ。拡張機能はWebページの操作に必要なアクセス許可を要求します。</div>
  <script src="popup.js"></script>
</body></html>
