name: Validate VoicePilot release candidates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This workflow deliberately has no release-write permission. A CI build is an
# unsigned candidate, not a distributable release: the owner signs it offline
# and publishes the ZIP plus its detached signature only after independent
# fingerprint verification and hardware acceptance.
permissions:
  contents: read

# Keep production publishing serialized, but let a corrected PR cancel its
# own obsolete CI instead of waiting behind a hung test from that PR.
concurrency:
  group: voicepilot-release-candidate-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Python unit tests
        timeout-minutes: 4
        run: python -m unittest discover -s tests -q
      - name: Chrome extension unit tests
        shell: pwsh
        run: |
          node --check chrome-extension/background.js
          Get-ChildItem tests_js/*.test.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }
      - name: Build release archive and check extension version
        run: python scripts/build_release.py
      - name: Retain unsigned release candidate for offline signing
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-voicepilot-release-candidate
          path: dist/VoicePilot-v*.zip
          if-no-files-found: error
          retention-days: 14
