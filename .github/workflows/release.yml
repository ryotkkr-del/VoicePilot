name: Test and publish stable VoicePilot releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voicepilot-release
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Python unit tests
        run: python -m unittest discover -s tests -q
      - name: Chrome extension unit tests
        shell: pwsh
        run: |
          node --check chrome-extension/background.js
          Get-ChildItem tests_js/*.test.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }
      - name: Build release archive
        run: python scripts/build_release.py
      - name: Publish only new version after successful tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          if ($releases | Where-Object { $_.tagName -eq $tag }) {
            Write-Host "Release $tag already exists; unchanged versions never replace an asset."
            exit 0
          }
          gh release create $tag "dist/VoicePilot-$tag.zip" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VoicePilot $tag" --notes "Tested source release for VoicePilot (Windows 11 prototype). Updates apply at next launch. Not yet validated end-to-end on the user's PC."